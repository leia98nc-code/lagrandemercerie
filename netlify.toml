[build]
  command = "npm run build"
  publish = "dist"
  ignore = 'if [ "$COMMIT_REF" = "$CACHED_COMMIT_REF" ]; then false; else git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.js netlify.toml :!public/images/products :!public/images/shop; fi'

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
